name: Build App

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            label: macos-arm64
          - runner: macos-15-intel
            label: macos-x86_64
          - runner: windows-latest
            label: windows-x86_64
          - runner: ubuntu-latest
            label: linux-x86_64
          - runner: ubuntu-24.04-arm
            label: linux-arm64

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 \
            libegl1 \
            libxkbcommon0 \
            libdbus-1-3 \
            libfontconfig1 \
            libglib2.0-0 \
            libfuse2 \
            file

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller certifi pyside6 qasync menai

      - name: Extract version
        id: version
        shell: bash
        run: |
          VERSION=$(python -c "from src.desktop.version import CURRENT_VERSION; print(CURRENT_VERSION)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      # macOS build
      - name: Import code signing certificate (macOS)
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          # Create a temporary keychain
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PWD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"

          # Import the certificate
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" -P "$MACOS_CERTIFICATE_PWD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"

          # Set the cert identity for codesign
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain
          security find-identity -v

      - name: Install create-dmg (macOS)
        if: runner.os == 'macOS'
        run: |
          brew untap aws/tap
          brew install create-dmg

      - name: Build app with PyInstaller (macOS)
        if: runner.os == 'macOS'
        env:
          CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
        run: pyinstaller humbug.spec --clean

      - name: Create DMG (macOS)
        if: runner.os == 'macOS'
        run: ./build-dmg.sh

      - name: Notarize DMG (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool submit dist/Humbug-v${{ steps.version.outputs.version }}-macos-*.dmg \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

          xcrun stapler staple dist/Humbug.app

      - name: Cleanup keychain (macOS)
        if: runner.os == 'macOS' && always()
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          if security show-keychain-info "$KEYCHAIN_PATH" &>/dev/null; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi

      - name: Upload artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: Humbug-v${{ steps.version.outputs.version }}-${{ matrix.label }}
          path: dist/Humbug-v${{ steps.version.outputs.version }}-macos-*.dmg

      # Windows build
      - name: Install Inno Setup (Windows)
        if: runner.os == 'Windows'
        run: choco install innosetup -y --no-progress

      - name: Build app with PyInstaller (Windows)
        if: runner.os == 'Windows'
        run: pyinstaller humbug.spec --clean

      - name: Run Inno Setup (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set ISCC=""
          if exist "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" set ISCC="C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if exist "C:\Program Files\Inno Setup 6\ISCC.exe" set ISCC="C:\Program Files\Inno Setup 6\ISCC.exe"
          if %ISCC%=="" (
            echo ERROR: Inno Setup not found.
            exit /b 1
          )
          %ISCC% /dMyAppVersion=%APP_VERSION% humbug-installer.iss

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: Humbug-v${{ steps.version.outputs.version }}-${{ matrix.label }}
          path: dist/Humbug-v${{ steps.version.outputs.version }}-windows-x86_64.exe

      # Linux build
      - name: Build app with PyInstaller (Linux)
        if: runner.os == 'Linux'
        run: pyinstaller humbug.spec --clean

      - name: Build AppImage (Linux)
        if: runner.os == 'Linux'
        run: ./build-appimage.sh

      - name: Upload artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: Humbug-v${{ steps.version.outputs.version }}-${{ matrix.label }}
          path: dist/Humbug-v${{ steps.version.outputs.version }}-linux-*.AppImage

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum * > checksums.txt

      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/*
